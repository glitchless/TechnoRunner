name: build
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    # vcpkg binary caching via the GitHub Actions cache backend. Only the Windows
    # job uses vcpkg, so this is a no-op elsewhere. Cache misses or backend errors
    # are non-fatal: vcpkg falls back to building from source.
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64,  arch: x86_64 }
          - { os: windows-latest, name: windows-x86_64, arch: x86_64 }
          - { os: macos-14,       name: macos-arm64,    arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Install libarchive (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev libfuse2 imagemagick

      - name: Install libarchive (macOS)
        if: runner.os == 'macOS'
        run: brew install libarchive

      # Windows deps come from the vcpkg.json manifest. In manifest mode the
      # vcpkg CMake toolchain auto-installs them at configure time (with a
      # triplet matching the build), so no explicit `vcpkg install` step is needed.

      # Expose the GitHub Actions cache backend to vcpkg's x-gha binary cache
      # (see VCPKG_BINARY_SOURCES above). Both URL var names are exported to
      # cover old and new Actions cache services.
      - name: Export Actions cache env for vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            # macOS auto-detects the keg-only libarchive prefix in CMakeLists.txt.
            cmake -B build -S .
          fi

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        # -C Release is required for multi-config generators (Visual Studio on
        # Windows); ignored harmlessly by single-config generators (Linux/macOS).
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          mkdir -p AppDir/usr/bin && cp build/TechnoRunner AppDir/usr/bin/
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          printf '[Desktop Entry]\nType=Application\nName=TechnoRunner\nExec=TechnoRunner\nIcon=technorunner\nCategories=Game;\n' > AppDir/usr/share/applications/technorunner.desktop
          convert resources/background.jpeg -resize 256x256! AppDir/usr/share/icons/hicolor/256x256/apps/technorunner.png
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv TechnoRunner*.AppImage TechnoRunner-${{ matrix.name }}.AppImage

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/Minecraft.app -dmg
          mv build/Minecraft.dmg TechnoRunner-${{ matrix.name }}.dmg

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist && cp build/Release/TechnoRunner.exe dist/ 2>/dev/null || cp build/TechnoRunner.exe dist/
          windeployqt dist/TechnoRunner.exe
          7z a TechnoRunner-${{ matrix.name }}.zip ./dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechnoRunner-${{ matrix.name }}
          path: |
            TechnoRunner-*.AppImage
            TechnoRunner-*.dmg
            TechnoRunner-*.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TechnoRunner-*.AppImage
            TechnoRunner-*.dmg
            TechnoRunner-*.zip
